[package]
changelog = "CHANGELOG.md"

[[package.versioned_files]]
path = "nixfmt.cabal"
regex = '(?m:^version: *(?<version>[^ ]+)$)'


[github]
owner = "NixOS"
repo = "nixfmt"


[release_notes]
change_templates = [
    "### $summary ($commit_hash)\n\n$details\n\nBy $commit_author_name",
    "- **$summary** by $commit_author_name ($commit_hash)",
    "### $summary\n\n$details",
    "- **$summary**",
]


[[workflows]]
name = "prepare-release"
help_text = "Prepare a new release (bump version, update changelog, commit changes)"

[[workflows.steps]]
type = "Command"
command = "git switch -c release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "git commit -m 'chore: release $version'"

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "chore: release $version"

[workflows.steps.body]
template = """
**This PR was created by Knope. Merging it will release $version.**

---

$changelog
"""


[[workflows]]
name = "release"
help_text = "Publish the current release"

[[workflows.steps]]
type = "Release"


[[workflows]]
name = "document-change"
help_text = "Create a new change file to be included in the next release"

[[workflows.steps]]
type = "CreateChangeFile"


[[workflows]]
name = "print-version"
help_text = "Print the current version of the project"

[[workflows.steps]]
type = "Command"
command = "echo '$version'"


[[workflows]]
name = "print-release-notes"
help_text = "Print the current version's release notes from the project changelog"

[[workflows.steps]]
type = "Command"
shell = true
command = """
cat <<EOF
$changelog
EOF
"""
